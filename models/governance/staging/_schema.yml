models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
  - name: stg_locations
    columns:
      - name: location_id
        tests:
          - not_null
          - unique
  - name: stg_order_items
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

  - name: stg_orders
    config:
      access: protected
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: ordered_at
        data_tests:
          - date_greater_than:
              arguments:
                date_field: "2016-01-01"
  - name: stg_products
    group: product
    access: private
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
  - name: stg_supplies
    columns:
      - name: supply_uuid
        tests:
          - not_null
          - unique