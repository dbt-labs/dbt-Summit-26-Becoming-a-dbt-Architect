models:
  - name: fct_order_items
    description: Order line items enriched with order, customer, and location attributes.
    columns:
      - name: order_item_id
        description: Unique identifier for the order line item.
      - name: order_id
        description: Identifier for the order containing the line item.
      - name: product_id
        description: Identifier for the product on the line item.
      - name: location_id
        description: Identifier for the order location.
      - name: customer_id
        description: Identifier for the customer who placed the order.
      - name: order_total
        description: Total amount charged for the order.
      - name: tax_paid
        description: Tax amount paid on the order.
      - name: ordered_at
        description: Timestamp when the order was placed.
      - name: customer_name
        description: Name of the customer who placed the order.
      - name: location_name
        description: Name of the order location.
      - name: tax_rate
        description: Tax rate applied to the order.
      - name: location_opened_at
        description: Timestamp when the order location opened.
